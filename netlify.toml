# Só publica quando muda algo que vai para o site (economiza créditos do Netlify).
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src index.html package.json package-lock.json vite.config.ts tsconfig.json public metadata.json"

# Arquivos com hash no nome nunca mudam: o navegador pode guardar por 1 ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
