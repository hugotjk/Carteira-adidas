# Só publica quando muda algo que vai para o site (economiza créditos do Netlify).
[build]
# Compara com o commit anterior do main (HEAD^). O $CACHED_COMMIT_REF não serve: a prévia do PR atualiza o cache
# e o merge parecia "sem mudança" (05/11 o app novo foi pulado).
  ignore = "git diff --quiet HEAD^ HEAD -- src index.html package.json package-lock.json vite.config.ts tsconfig.json public metadata.json netlify.toml"

# Arquivos com hash no nome nunca mudam: o navegador pode guardar por 1 ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
